<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="headerfooter.css">
    <script>
        
        function showAlert() {
            alert("Thank you for your feedback!");
            return true; // To allow the form submission
        }
    </script>
</head>
<body>
    <!--HeaderSection-->
    <div class="container">
        <header class="fixed-header">
            <img src="Logo.png" alt="logo" height="150px" width="150px">
            <h1>Ekita Grocery Store<small>(The Nepalese Cuisine)</small></h1>
            <a href="login.html"> Sign In</a>
            <a href="signup.html"> Sign Up</a>
        </header>
        <nav>
            <a href="index.html"> Home</a>
            <a href="grocery.html"> Grocery Items</a>
            <a href="order.html"> Order</a>
            <a href="feedback.html"> Feedback</a>
            <a href="about.html"> About</a>
        </nav>
    </div>

    <!--ContentSection-->
    <div class="main-feedback-form">
        <form action="index.html"  onsubmit="return showAlert()">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="name" placeholder="Your name" required>
            <br><br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" class="email" placeholder="Your email" required>
            <br><br>
            <label for="tel">Phone Number</label>
            <input type="tel" name="tel" class="tel" maxlength="10" id="tel" placeholder="Your phone number" required>
            <br><br>
            <label for="description_feedback">Description of your Feedback:</label>
            <br><br>
            <textarea name="description_feedback" id="description_feedback" placeholder="Please describe your feedback here" rows="5" required></textarea>
            <br><br>
            <input name="submit" type="submit" value="Submit">
        </form>
    </div>

    <!--FooterSection-->
    <div class="container">
        <footer class="fixed-footer">
            <p>2024 My website. All rights reserved</p>
            <p>Contact: ekita143@uel.ac.uk</p>
            <p><a href="sitemap.html">Site Map</a></p>
        </footer>
    </div>
</body>
</html>
